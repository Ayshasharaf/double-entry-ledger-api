services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: ledger1234
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_admin -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: ledger_admin
      SPRING_DATASOURCE_PASSWORD: ledger1234
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ledger_pgdata:
